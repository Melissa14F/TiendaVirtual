<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechMarket</title>
    <meta name="description" content="Offers a user-friendly online store showcasing products with a custom logo, enabling seamless browsing and purchasing for customers." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="TechMarket" />
    <meta property="og:description" content="Offers a user-friendly online store showcasing products with a custom logo, enabling seamless browsing and purchasing for customers." />
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Contraparte del truco en 404.html: si venimos de una redirección
      // (?/ruta), la reescribe en la barra de direcciones antes de que
      // React Router monte, para que la SPA arranque en la ruta correcta.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
