<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TechMarket</title>
    <script type="text/javascript">
      // GitHub Pages no sabe servir rutas de una SPA (React Router).
      // Este truco redirige cualquier ruta desconocida a index.html,
      // codificando el path original para que la app lo pueda restaurar.
      var pathSegmentsToKeep = 1; // cantidad de segmentos del base ('/TechMarket')
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
